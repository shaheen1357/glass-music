name: Build IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select newest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode / SDK versions
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios || true

      - name: Install XcodeGen
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit tests (iOS Simulator)
        run: |
          set -o pipefail
          SIM_NAME=$(xcrun simctl list devices available \
            | grep -oE 'iPhone [0-9]+[^(]*' | head -n1 | sed 's/[[:space:]]*$//')
          echo "Testing on simulator: '${SIM_NAME:-<none found>}'"
          if [ -z "$SIM_NAME" ]; then echo "::error::No iPhone simulator available"; exit 1; fi
          xcodebuild test \
            -project Music.xcodeproj \
            -scheme Music \
            -destination "platform=iOS Simulator,name=$SIM_NAME" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build (unsigned, device)
        run: |
          set -o pipefail
          xcodebuild \
            -project Music.xcodeproj \
            -scheme Music \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            clean build

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/Music.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::App bundle not found at $APP_PATH"
            find build -name "*.app" || true
            exit 1
          fi
          rm -rf Payload Music.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr9 Music.ipa Payload
          echo "Built IPA:"; ls -lh Music.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v5
        with:
          name: Music-unsigned-ipa
          path: Music.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Build (iOS Simulator, for Appetize)
        run: |
          set -o pipefail
          xcodebuild \
            -project Music.xcodeproj \
            -scheme Music \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Stage simulator .app for Appetize
        run: |
          APP=$(find build-sim/Build/Products -name "Music.app" -type d | head -n1)
          if [ -z "$APP" ]; then echo "::error::Simulator Music.app not found"; exit 1; fi
          echo "Found simulator app: $APP"
          rm -rf appetize && mkdir -p appetize
          cp -R "$APP" appetize/

      - name: Upload simulator app (for Appetize)
        uses: actions/upload-artifact@v5
        with:
          name: Music-Simulator-app
          path: appetize
          if-no-files-found: error
          retention-days: 30
