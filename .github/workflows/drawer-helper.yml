name: Build drawer_helper.exe

# Standalone Windows build of the Coccinelle POS cash-drawer helper.
# Completely independent of the Music app build (build.yml) -- different runner,
# manual trigger, and it only ever reads tools/drawer-helper/. Nothing in the
# app (Sources/, project.yml, Music.xcodeproj, scripts/) is touched.
#
# Run it: GitHub -> Actions -> "Build drawer_helper.exe" -> Run workflow.
# Then download the "drawer_helper-windows" artifact from that run.

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/drawer-helper
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: pip install pyinstaller pywin32

      - name: Build drawer_helper.exe
        run: pyinstaller --onefile --console --name drawer_helper --hidden-import win32print drawer_helper.py

      - name: Bundle config + service scripts next to the exe
        shell: cmd
        run: |
          copy /Y config.ini dist\config.ini
          copy /Y install_service.bat dist\install_service.bat
          copy /Y uninstall_service.bat dist\uninstall_service.bat
          copy /Y README.md dist\README.md

      - name: Upload the ready-to-deploy folder
        uses: actions/upload-artifact@v5
        with:
          name: drawer_helper-windows
          path: tools/drawer-helper/dist/
          if-no-files-found: error
          retention-days: 30
