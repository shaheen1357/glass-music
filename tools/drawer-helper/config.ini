; Cash-drawer helper config. Sits next to drawer_helper.py / drawer_helper.exe.
; Configure ONE transport: an Ethernet printer IP, OR a Windows printer name.

[printer]
; --- Ethernet printer (recommended for a service: no drivers, works from
;     the service account). Leave `name` blank when using this. ---
ip   = 192.168.1.50
port = 9100

; --- USB printer instead: put the exact Windows printer name here and clear
;     `ip` above. Needs pywin32. Note: a Windows service may not see a
;     user-installed USB printer; Ethernet is more reliable as a service. ---
name =

[server]
; Must match HELPER_URL in ../static/src/drawer_buttons.js (default 9110).
listen_port = 9110

[log]
file = drawer_helper.log
